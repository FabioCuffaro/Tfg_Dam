<!-- LOGIN.HTML   Inicio de sesión sencillo  -->
<!-- ========================================== -->


<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Red Social TFG</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="card">
        <h1>¡Bienvenido de nuevo!</h1>
        <p class="subtitle">Inicia sesión para continuar</p>

        <!-- Mensaje de error global (credenciales incorrectas, servidor caído...) -->
        <div class="alert" id="globalError"></div>

        <!-- Formulario de login -->
        <div class="field">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="tu@email.com"
                autocomplete="email"
            />
            <span class="field-error" id="emailError">Introduce un email válido</span>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="••••••"
                autocomplete="current-password"
            />
            <span class="field-error" id="passwordError">La contraseña es obligatoria</span>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
            Iniciar Sesión
        </button>

        <!-- Barra de carga que aparece mientras espera la respuesta del servidor -->
        <div class="loading-bar" id="loadingBar">
            <div class="loading-bar-inner"></div>
        </div>

        <div class="link-row">
            ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </div>
    </div>

  <script src="js/login.js"></script>

</body>

</html>
