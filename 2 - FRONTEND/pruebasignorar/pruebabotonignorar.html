<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Demo Loading Bar</title>

<style>

/* VARIABLES */

:root {
    --black:  #000000;
    --gray:   #999999;
    --blue:   #6576B8;
    --purple: #71509C;
    --white:  #FFFFFF;
    --gradient: linear-gradient(140deg, #667eea, #764ba2);
}

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */

body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',
                 Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;

    background:var(--gradient);
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* CARD */

.card{
    background:var(--white);
    padding:2rem;
    border-radius:12px;
    width:100%;
    max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
    animation:fadeIn .4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card h1{
    font-size:1.4rem;
    margin-bottom:1rem;
}

/* INPUT */

.field{
    margin-bottom:1rem;
}

.field label{
    font-size:.8rem;
    font-weight:600;
    display:block;
    margin-bottom:.3rem;
}

.field input{
    width:100%;
    padding:.6rem .7rem;
    border:1.5px solid #ddd;
    border-radius:6px;
    font-size:.9rem;
}

.field input:focus{
    border-color:var(--blue);
    outline:none;
}

/* BOTON */

.btn-primary{
    width:100%;
    padding:.75rem;
    background:var(--blue);
    color:var(--white);
    border:none;
    border-radius:6px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    margin-top:.5rem;
}

.btn-primary:hover{
    transform:translateY(-1px);
}

.btn-primary:disabled{
    background:var(--gray);
    cursor:not-allowed;
}

/* LOADING BAR */

.loading-bar{
    width:100%;
    height:3px;
    background:#eee;
    border-radius:2px;
    margin-top:.8rem;
    overflow:hidden;
    display:none;
}

.loading-bar.visible{
    display:block;
}

.loading-bar-inner{
    height:100%;
    width:0%;
    background:var(--blue);
    border-radius:2px;
    animation:loading 1.5s ease-in-out infinite;
}

@keyframes loading{

    0%{
        width:0%;
        margin-left:0%;
    }

    50%{
        width:60%;
        margin-left:20%;
    }

    100%{
        width:0%;
        margin-left:100%;
    }

}

</style>
</head>

<body>

<div class="card">

<h1>Login</h1>

<div class="field">
<label>Email</label>
<input type="email">
</div>

<div class="field">
<label>Password</label>
<input type="password">
</div>

<button class="btn-primary" id="loginBtn">
Iniciar sesión
</button>

<div class="loading-bar" id="loadingBar">
<div class="loading-bar-inner"></div>
</div>

</div>

<script>

const btn = document.getElementById("loginBtn");
const bar = document.getElementById("loadingBar");

btn.addEventListener("click", () => {

    btn.disabled = true;

    bar.classList.add("visible");

    setTimeout(() => {

        bar.classList.remove("visible");

        btn.disabled = false;

        alert("Login simulado terminado");

    },10000);
 
});

</script>

</body>
</html>
