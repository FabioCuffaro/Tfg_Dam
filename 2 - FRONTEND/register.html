<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Red Social TFG</title>
  <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="card">
        <h1>Crear una cuenta</h1>
        <p class="subtitle">Únete a nuestra red social</p>

        <div class="alert" id="globalAlert"></div>

        <div class="field">
            <label for="username">Nombre de usuario</label>
            <input
                type="text"
                id="username"
                placeholder="juanperez"
                autocomplete="username"
                maxlength="20"
            />
            <span class="hint">Solo letras, números y guion bajo (3-20 caracteres)</span>
            <span class="field-error" id="usernameError">Nombre de usuario no válido</span>
        </div>

        <div class="field">
            <label for="displayName">Nombre completo</label>
            <input
                type="text"
                id="displayName"
                placeholder="Juan Pérez"
                autocomplete="name"
                maxlength="100"
            />
            <span class="field-error" id="displayNameError">El nombre es obligatorio</span>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="tu@email.com"
                autocomplete="email"
            />
            <span class="field-error" id="emailError">Introduce un email válido</span>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
                maxlength="100"
            />


            <!-- Indicador visual de debilidad de la contraseña -->
            <div class="password-strength" id="passwordStrength">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <span class="strength-text" id="strengthText"></span>
            </div>


            
            <span class="field-error" id="passwordError">Mínimo 6 caracteres</span>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
            />
            <span class="field-error" id="confirmPasswordError">Las contraseñas no coinciden</span>
        </div>

        <button class="btn-primary" id="registerBtn" onclick="handleRegister()">
            Crear Cuenta
        </button>

        <div class="loading-bar" id="loadingBar">
            <div class="loading-bar-inner"></div>
        </div>

        <div class="link-row">
            ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a>
        </div>
    </div>


  <script src="js/register.js"></script>
  
</body>
</html>
